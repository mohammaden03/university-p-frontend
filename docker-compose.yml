version: '3.8'

services:
  htr-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manuscript-htr-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_BASE_URL=http://localhost:3000/api/v1
    restart: unless-stopped
